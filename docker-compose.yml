services:
  db:
    image: postgres:16-alpine
    container_name: trainpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: trainpilot
      POSTGRES_PASSWORD: trainpilot_secret_pass
      POSTGRES_DB: trainpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainpilot -d trainpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zombierun_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://trainpilot:trainpilot_secret_pass@db:5432/trainpilot_db
      SECRET_KEY: zombierun_production_secret_key_change_me
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: zombierun_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
